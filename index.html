<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IntelEcho</title>
  <style>
    :root { --teal: #0f766e; --teal-dark: #115e59; --ink: #0f172a; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
    main { min-height: 100%; max-width: 520px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 2.5rem; color: var(--teal); }
    p { margin: 0 0 32px; font-size: 1.1rem; }
    a.btn { display: flex; align-items: center; justify-content: center; min-height: 64px; margin-bottom: 16px; padding: 12px 16px; border-radius: 16px; border: 3px solid var(--teal); font-size: 1.2rem; font-weight: 700; text-decoration: none; }
    a.btn { background: var(--teal); color: #fff; }
    a.btn:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
    a.btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>IntelEcho</h1>
    <p>Live translation that lets two people who speak different languages connect and share.</p>
    <a class="btn" href="https://intelecho.app" target="_blank" rel="noopener">Open IntelEcho</a>
  </main>
</body>
</html>
